name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-data:
    name: Validate game data (JSON)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse every data file
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          files = sorted(glob.glob('game/data/**/*.json', recursive=True))
          bad = []
          for f in files:
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))
                  print('FAIL', f, e)
          print('checked %d data files, %d bad' % (len(files), len(bad)))
          sys.exit(1 if bad else 0)
          EOF

  sim-tests:
    name: Deterministic sim tests (headless Godot)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.4-stable
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64
      - name: Import project (builds the script class cache)
        run: |
          ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path game --import || true
      - name: Run sim test suite
        run: |
          ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path game -s res://tests/run_tests.gd
