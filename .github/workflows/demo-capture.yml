name: Demo Capture

# Records the M1 grey-box battle (auto-battle mode) to video on a
# runner — Godot Movie Maker under Xvfb with Mesa software GL — then
# commits demo/demo.mp4 + stills back to the branch so the video can be
# reviewed without a local machine.

on:
  workflow_dispatch:
  push:
    # Never auto-capture on main: a PR merge that touches the request
    # file would otherwise film on main and commit a bot commit there,
    # which then merge-conflicts with the next feature branch.
    branches-ignore: [main]
    paths: ["demo/capture-request.txt"]

permissions:
  contents: write

concurrency:
  group: demo-capture
  # A newer capture request supersedes an older one outright: without
  # this, a run that hangs on a heavy scene holds the queue for its
  # full 30-minute timeout before the fix gets to film.
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.4-stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Install capture tools (Xvfb, Mesa, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg libgl1-mesa-dri

      - name: Import project
        run: |
          ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path game --import || true

      - name: Record Lexington Green (Movie Maker, software GL)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 \
            --path game res://scenes/battle.tscn \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --audio-driver Dummy \
            --resolution 1280x720 \
            --fixed-fps 30 --write-movie /tmp/battle.avi \
            -- --auto --scenario=lexington --time-scale=1.4 --quit-after=110

      - name: Record the free world (Boston, the 18th of April)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 \
            --path game res://scenes/world.tscn \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --audio-driver Dummy \
            --resolution 1280x720 \
            --fixed-fps 30 --write-movie /tmp/world.avi \
            -- --auto --world=boston_1775 --quit-after=96

      - name: Encode mp4 and stills
        run: |
          mkdir -p demo
          rm -f demo/still-*.png
          ffmpeg -y -i /tmp/battle.avi -i /tmp/world.avi \
            -filter_complex "[0:v][1:v]concat=n=2:v=1:a=0[v]" -map "[v]" \
            -c:v libx264 -preset medium -crf 27 \
            -pix_fmt yuv420p -movflags +faststart demo/demo.mp4
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 demo/demo.mp4)
          for frac in 15 40 60 80 92; do
            ffmpeg -y -ss "$(echo "$DUR*0.$frac" | bc)" -i demo/demo.mp4 \
              -frames:v 1 "demo/still-$frac.png"
          done
          ls -la demo/

      - name: Commit captured media to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/demo.mp4 demo/still-*.png
          git add -A demo/
          if git diff --cached --quiet; then
            echo "Captured media is identical to what's committed — nothing to push."
          else
            git commit -m "Add captured M1 demo video [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
