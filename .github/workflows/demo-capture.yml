name: Demo Capture

# Records the M1 grey-box battle (auto-battle mode) to video on a
# runner — Godot Movie Maker under Xvfb with Mesa software GL — then
# commits demo/demo.mp4 + stills back to the branch so the video can be
# reviewed without a local machine.

on:
  workflow_dispatch:
  push:
    # Never auto-capture on main: a PR merge that touches the request
    # file would otherwise film on main and commit a bot commit there,
    # which then merge-conflicts with the next feature branch.
    branches-ignore: [main]
    paths: ["demo/capture-request.txt"]

permissions:
  contents: write

concurrency:
  group: demo-capture
  # A newer capture request supersedes an older one outright: without
  # this, a run that hangs on a heavy scene holds the queue for its
  # full 30-minute timeout before the fix gets to film.
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GODOT_VERSION: 4.4-stable
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64

      - name: Install capture tools (Xvfb, Mesa, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg libgl1-mesa-dri

      - name: Import project
        run: |
          ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path game --import || true

      - name: Record Lexington Green (Movie Maker, software GL)
        run: |
          S=$(date +%s)
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 \
            --path game res://scenes/battle.tscn \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --audio-driver Dummy \
            --resolution 1280x720 \
            --fixed-fps 30 --write-movie /tmp/battle.avi \
            -- --auto --scenario=lexington --time-scale=1.4 --quit-after=110
          echo "BATTLE_SECS=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"

      - name: Record the free world (Boston, the 18th of April)
        run: |
          S=$(date +%s)
          xvfb-run -a -s "-screen 0 1280x720x24" \
            ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 \
            --path game res://scenes/world.tscn \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --audio-driver Dummy \
            --resolution 1280x720 \
            --fixed-fps 24 --write-movie /tmp/world.avi \
            -- --auto --world=boston_1775 --time-scale=2.0 --quit-after=100
          echo "WORLD_SECS=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"

      - name: Encode mp4 and stills
        run: |
          mkdir -p demo
          rm -f demo/still-*.png
          ffmpeg -y -i /tmp/battle.avi -i /tmp/world.avi \
            -filter_complex "[0:v][1:v]concat=n=2:v=1:a=0[v]" -map "[v]" \
            -c:v libx264 -preset medium -crf 27 \
            -pix_fmt yuv420p -movflags +faststart demo/demo.mp4
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 demo/demo.mp4)
          for frac in 15 40 60 80 92; do
            ffmpeg -y -ss "$(echo "$DUR*0.$frac" | bc)" -i demo/demo.mp4 \
              -frames:v 1 "demo/still-$frac.png"
          done
          ls -la demo/

      - name: Commit captured media and the run record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A demo/
          if git diff --cached --quiet -- demo/demo.mp4 demo/still-*.png; then
            CHANGED="unchanged (identical render)"
          else
            CHANGED="NEW FILM"
          fi
          # The run record is committed every time — a capture that
          # produces no new footage must still visibly finish, or a
          # watcher cannot tell "done" from "still going".
          if [ ! -f demo/capture-log.md ]; then
            printf '# Capture log\n\nEvery Demo Capture run lands a line here, film or no film.\n\n| finished (UTC) | commit | battle | world | result |\n|---|---|---|---|---|\n' > demo/capture-log.md
          fi
          printf '| %s | `%s` | %ss | %ss | %s |\n' \
            "$(date -u +'%Y-%m-%d %H:%M')" "$(git rev-parse --short HEAD)" \
            "${BATTLE_SECS:-?}" "${WORLD_SECS:-?}" "$CHANGED" >> demo/capture-log.md
          git add demo/capture-log.md
          git commit -m "Capture run: $CHANGED [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "::notice title=Capture finished::$CHANGED (battle ${BATTLE_SECS:-?}s, world ${WORLD_SECS:-?}s)"
